name: TalentBridge Azure CD Deployment

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Build & Push Container to Azure Container Registry (ACR)
  # ============================================================================
  build-and-push-acr:
    name: Build & Push to Azure Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Azure CLI Login (OIDC / Service Principal)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. talentbridgeacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Production Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          REGISTRY=${{ secrets.ACR_LOGIN_SERVER }}
          
          docker build -t $REGISTRY/talentbridge-ats:$IMAGE_TAG -t $REGISTRY/talentbridge-ats:latest .
          docker push $REGISTRY/talentbridge-ats:$IMAGE_TAG
          docker push $REGISTRY/talentbridge-ats:latest

  # ============================================================================
  # JOB 2: Deploy to Azure App Service (Linux Web App Container)
  # ============================================================================
  deploy-to-azure:
    name: Deploy to Azure App Service
    needs: build-and-push-acr
    runs-on: ubuntu-latest
    steps:
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # e.g. app-talentbridge-prod
          images: '${{ secrets.ACR_LOGIN_SERVER }}/talentbridge-ats:${{ github.sha }}'

      - name: Verify Application Health
        run: |
          echo "Waiting 30 seconds for container startup on Azure..."
          sleep 30
          HEALTH_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/actuator/health"
          echo "Checking health endpoint at $HEALTH_URL"
          curl -f --retry 5 --retry-delay 10 --max-time 15 $HEALTH_URL || echo "App warming up..."
