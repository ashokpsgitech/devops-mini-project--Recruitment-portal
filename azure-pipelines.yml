# ==============================================================================
# TalentBridge ATS — Azure DevOps Multi-Stage Pipeline
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  mavenCacheDir: $(Pipeline.Workspace)/.m2/repository
  dockerImageName: 'talentbridge-ats'
  azureSubscription: 'Azure-DevOps-TalentBridge-SPN'
  acrRegistry: 'ashoktalentbridgeacr.azurecr.io'
  azureWebAppName: 'talentbridge-ats-prod'

stages:
  # ============================================================================
  # STAGE 1: Build & Automated Testing (CI)
  # ============================================================================
  - stage: BuildAndTest
    displayName: 'Build, Unit & Integration Tests'
    jobs:
      - job: MavenBuild
        displayName: 'Maven Build & Test'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Set up JDK 21'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheDir)
            displayName: 'Cache Maven packages'

          - script: ./mvnw clean verify -B
            displayName: 'Run Maven Verify & Jacoco'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true
            displayName: 'Publish Unit Test Results'

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
            displayName: 'Publish JaCoCo Code Coverage'

          - task: CopyFiles@2
            inputs:
              contents: 'target/*.jar'
              targetFolder: '$(Build.ArtifactStagingDirectory)'
            displayName: 'Stage Build Artifacts'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'drop'
            displayName: 'Publish Pipeline Artifacts'

  # ============================================================================
  # STAGE 2: Containerization & Security Scanning (DevSecOps)
  # ============================================================================
  - stage: Containerize
    displayName: 'Docker Build, Trivy Scan & ACR Push'
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DockerBuildAndPush
        displayName: 'Build, Scan, and Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              repository: $(dockerImageName)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              echo "Installing Trivy vulnerability scanner..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp v0.50.1
              echo "Scanning container image for HIGH and CRITICAL vulnerabilities..."
              /tmp/trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 $(dockerImageName):$(Build.BuildId)
            displayName: 'Trivy Container Vulnerability Scan'

          - task: Docker@2
            displayName: 'Push to Azure Container Registry'
            inputs:
              containerRegistry: 'TalentBridge-ACR-ServiceConnection'
              repository: $(dockerImageName)
              command: 'push'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================================
  # STAGE 3: Deploy to Azure App Service (CD)
  # ============================================================================
  - stage: DeployProduction
    displayName: 'Deploy to Azure Production'
    dependsOn: Containerize
    jobs:
      - deployment: DeployAppService
        displayName: 'Deploy Container to Azure Web App'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Azure Web App Container'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(azureWebAppName)
                    imageName: '$(acrRegistry)/$(dockerImageName):$(Build.BuildId)'

                - script: |
                    echo "Waiting 30 seconds for container warming..."
                    sleep 30
                    HEALTH_URL="https://$(azureWebAppName).azurewebsites.net/actuator/health"
                    echo "Validating health at $HEALTH_URL"
                    curl -f --retry 5 --retry-delay 10 --max-time 15 $HEALTH_URL || echo "App warming up..."
                  displayName: 'Post-Deployment Health Check'
