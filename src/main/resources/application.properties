spring.application.name=TalentBridge-ATS
server.port=${SERVER_PORT:8080}

# ============================================================
# DATABASE (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruitment_db}
spring.datasource.username=${DB_USERNAME:recruitment_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# JPA / HIBERNATE — validate against Flyway-managed schema
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY — database migrations
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# FILE UPLOAD — resume limits
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# RESUME STORAGE
# ============================================================
app.storage.local.path=${RESUME_STORAGE_PATH:${user.home}/.talentbridge/resumes}

# ============================================================
# SPRING SECURITY SESSION
# ============================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# ============================================================
# EMAIL (SMTP) — configure for notifications
# ============================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ============================================================
# ACTUATOR — expose health and metrics endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=false
management.metrics.tags.application=${spring.application.name}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.example.recruitment=${LOGGING_LEVEL_APP:INFO}
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n