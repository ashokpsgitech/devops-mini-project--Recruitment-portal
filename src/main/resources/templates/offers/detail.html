<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Offer Letter')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="tb-container" style="max-width: 840px;">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="tb-page-header">
        <div>
            <h1 class="tb-page-title">Employment Offer</h1>
            <p class="tb-page-subtitle">Candidate: <strong th:text="${offer.application.applicant != null ? offer.application.applicant.fullName : 'Candidate'}">Candidate</strong> &bull; Role: <span th:text="${offer.application.job.title}">Position</span></p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
            <a th:href="@{/offers}" class="tb-btn tb-btn-secondary tb-btn-sm">&larr; Back to Offers</a>
        </div>
    </div>

    <div class="tb-card" style="border: 2px solid var(--primary-100); background: #ffffff;">
        <div class="tb-card-header">
            <div>
                <span class="tb-badge"
                      th:classappend="${offer.status.name() == 'ACCEPTED' ? 'tb-badge-hired' : (offer.status.name() == 'DECLINED' ? 'tb-badge-rejected' : 'tb-badge-pending')}"
                      th:text="${offer.status}">PENDING</span>
            </div>
            <div style="font-size: 0.85rem; color: var(--slate-400);">
                Extended on: <strong th:text="${#temporals.format(offer.createdAt, 'MMM dd, yyyy')}">Date</strong>
            </div>
        </div>

        <div style="text-align: center; margin: 2rem 0; padding: 2rem; background: var(--primary-50); border-radius: var(--radius-lg);">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--primary-700); text-transform: uppercase; letter-spacing: 0.05em;">Total Compensation</span>
            <div style="font-size: 3rem; font-weight: 800; color: var(--primary-700); margin-top: 0.25rem;">
                <span th:text="${offer.currency}">INR</span> <span th:text="${#numbers.formatDecimal(offer.salary, 0, 'COMMA', 0, 'POINT')}">2,400,000</span>
            </div>
            <p style="color: var(--slate-600); font-size: 0.95rem; margin-top: 0.5rem;">Base Annual Compensation package</p>
        </div>

        <div class="tb-form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 2rem;">
            <div>
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Anticipated Start Date</span>
                <div style="font-weight: 700; font-size: 1.1rem; color: var(--slate-800); margin-top: 0.2rem;"
                     th:text="${offer.startDate != null ? #temporals.format(offer.startDate, 'MMMM dd, yyyy') : 'Mutually Agreed'}">Date</div>
            </div>
            <div>
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Offer Expiration</span>
                <div style="font-weight: 700; font-size: 1.1rem; color: var(--slate-800); margin-top: 0.2rem;"
                     th:text="${offer.expiryDate != null ? #temporals.format(offer.expiryDate, 'MMMM dd, yyyy') : 'No Expiry'}">Date</div>
            </div>
        </div>

        <div th:if="${offer.notes != null and not #strings.isEmpty(offer.notes)}" style="padding-top: 1.5rem; border-top: 1px solid var(--slate-100); margin-bottom: 2rem;">
            <span style="font-size: 0.8rem; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Terms, Equity & Benefits Summary</span>
            <p style="color: var(--slate-700); margin-top: 0.5rem; line-height: 1.7; white-space: pre-wrap;" th:text="${offer.notes}">Notes</p>
        </div>

        <!-- Candidate Acceptance Controls (only shown to applicant if status is PENDING) -->
        <div th:if="${isApplicant and offer.status.name() == 'PENDING'}"
             style="padding-top: 2rem; border-top: 2px dashed var(--slate-200); display: flex; justify-content: center; gap: 1.5rem;">
            <form th:action="@{/offers/{id}/respond(id=${offer.id})}" method="post">
                <input type="hidden" name="response" value="ACCEPTED">
                <button type="submit" class="tb-btn tb-btn-success" style="padding: 0.85rem 2rem; font-size: 1rem;">
                    ✓ Accept Job Offer
                </button>
            </form>

            <form th:action="@{/offers/{id}/respond(id=${offer.id})}" method="post">
                <input type="hidden" name="response" value="DECLINED">
                <button type="submit" class="tb-btn tb-btn-danger" style="padding: 0.85rem 2rem; font-size: 1rem;">
                    ✕ Decline Offer
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
