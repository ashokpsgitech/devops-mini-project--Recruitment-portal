<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — TalentBridge ATS'">TalentBridge ATS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
</head>
<body>

<header class="tb-navbar" th:fragment="navbar">
    <div class="tb-nav-container">
        <a th:href="@{/}" class="tb-brand">
            <div class="tb-brand-icon">⚡</div>
            <span>TalentBridge</span>
        </a>

        <ul class="tb-nav-links">
            <li><a th:href="@{/jobs}" class="tb-nav-link">Jobs</a></li>
            <li sec:authorize="hasAnyRole('RECRUITER', 'ADMIN')">
                <a th:href="@{/recruiter/pipeline}" class="tb-nav-link">Pipeline</a>
            </li>
            <li sec:authorize="hasAnyRole('RECRUITER', 'ADMIN')">
                <a th:href="@{/recruiter/jobs}" class="tb-nav-link">Manage Jobs</a>
            </li>
            <li sec:authorize="hasAnyRole('HIRING_MANAGER', 'RECRUITER', 'ADMIN', 'APPLICANT')">
                <a th:href="@{/interviews}" class="tb-nav-link">Interviews</a>
            </li>
            <li sec:authorize="hasAnyRole('RECRUITER', 'ADMIN', 'APPLICANT')">
                <a th:href="@{/offers}" class="tb-nav-link">Offers</a>
            </li>
            <li sec:authorize="hasRole('APPLICANT')">
                <a th:href="@{/applications}" class="tb-nav-link">My Applications</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/swagger-ui/index.html}" target="_blank" class="tb-nav-link">API Docs</a>
            </li>
        </ul>

        <div class="tb-nav-right">
            <!-- Notifications (authenticated only) -->
            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/notifications}" class="tb-badge-counter" title="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span th:if="${unreadNotifications != null and unreadNotifications > 0}"
                          th:text="${unreadNotifications}" class="tb-counter-dot"></span>
                </a>
            </div>

            <!-- User Pill -->
            <div sec:authorize="isAuthenticated()" class="tb-user-pill">
                <div class="tb-avatar">👤</div>
                <span sec:authentication="name">User</span>
                <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 0.5rem;">
                    <button type="submit" class="tb-btn tb-btn-secondary tb-btn-sm" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">Logout</button>
                </form>
            </div>

            <!-- Login / Register buttons for guests -->
            <div sec:authorize="!isAuthenticated()" style="display: flex; gap: 0.5rem;">
                <a th:href="@{/login}" class="tb-btn tb-btn-secondary tb-btn-sm">Log in</a>
                <a th:href="@{/register}" class="tb-btn tb-btn-primary tb-btn-sm">Register</a>
            </div>
        </div>
    </div>
</header>

<div th:fragment="alerts">
    <div th:if="${success}" class="tb-alert tb-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="tb-alert tb-alert-error" th:text="${error}"></div>
    <div th:if="${loginError}" class="tb-alert tb-alert-error" th:text="${loginError}"></div>
    <div th:if="${logoutMessage}" class="tb-alert tb-alert-success" th:text="${logoutMessage}"></div>
</div>

<footer class="tb-footer" th:fragment="footer">
    <p>&copy; 2026 TalentBridge Enterprise ATS. High-velocity hiring powered by modern Cloud Native architecture.</p>
</footer>

</body>
</html>
