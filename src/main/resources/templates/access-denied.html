<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="tb-container" style="display: flex; align-items: center; justify-content: center; flex: 1;">
    <div style="text-align: center; max-width: 500px; padding: 3rem; background: white; border-radius: var(--radius-xl); border: 1px solid var(--slate-200); box-shadow: var(--shadow-lg);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔒</div>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.5rem;">Access Denied (403)</h1>
        <p style="color: var(--slate-600); margin-bottom: 2rem; line-height: 1.6;">
            You do not possess the required organizational role privileges to access this resource or administrative operation.
        </p>
        <a th:href="@{/dashboard}" class="tb-btn tb-btn-primary">Return to Dashboard</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
