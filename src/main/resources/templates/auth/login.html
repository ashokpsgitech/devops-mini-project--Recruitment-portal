<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column;">

<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: #ffffff; border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: var(--shadow-xl);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 50px; height: 50px; background: var(--primary-gradient); border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; margin-bottom: 1rem; box-shadow: var(--primary-glow);">⚡</div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900);">Welcome Back</h1>
            <p style="color: var(--slate-500); font-size: 0.95rem; margin-top: 0.25rem;">Sign in to your TalentBridge ATS account</p>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/login}" method="post">
            <div class="tb-form-group">
                <label class="tb-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="tb-input" placeholder="e.g. admin or applicant" required autofocus>
            </div>

            <div class="tb-form-group">
                <label class="tb-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="tb-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="tb-btn tb-btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--slate-500);">
            Don't have an account?
            <a th:href="@{/register}" style="color: var(--primary-600); font-weight: 600; text-decoration: none;">Create applicant profile</a>
        </div>

        <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-100); font-size: 0.78rem; color: var(--slate-400); text-align: center;">
            Demo credentials: <span style="font-family: var(--font-mono); color: var(--slate-600);">admin / Admin@12345</span>
        </div>
    </div>
</div>

</body>
</html>
