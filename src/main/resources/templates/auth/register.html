<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Applicant Registration')}"></head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column;">

<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: #ffffff; border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 520px; box-shadow: var(--shadow-xl);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 50px; height: 50px; background: var(--primary-gradient); border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; margin-bottom: 1rem; box-shadow: var(--primary-glow);">🚀</div>
            <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--slate-900);">Create Your Account</h1>
            <p style="color: var(--slate-500); font-size: 0.95rem; margin-top: 0.25rem;">Join TalentBridge and discover career opportunities</p>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/register}" th:object="${request}" method="post">
            <div class="tb-form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
                <div class="tb-form-group">
                    <label class="tb-label" for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="tb-input" placeholder="Jane" required>
                    <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="tb-alert-error" style="display:block; margin-top: 0.25rem; font-size:0.75rem;"></span>
                </div>
                <div class="tb-form-group">
                    <label class="tb-label" for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="tb-input" placeholder="Doe" required>
                    <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="tb-alert-error" style="display:block; margin-top: 0.25rem; font-size:0.75rem;"></span>
                </div>
            </div>

            <div class="tb-form-group">
                <label class="tb-label" for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" class="tb-input" placeholder="janedoe" required>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="tb-alert-error" style="display:block; margin-top: 0.25rem; font-size:0.75rem;"></span>
            </div>

            <div class="tb-form-group">
                <label class="tb-label" for="email">Work / Personal Email</label>
                <input type="email" id="email" th:field="*{email}" class="tb-input" placeholder="jane.doe@example.com" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="tb-alert-error" style="display:block; margin-top: 0.25rem; font-size:0.75rem;"></span>
            </div>

            <div class="tb-form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
                <div class="tb-form-group">
                    <label class="tb-label" for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="tb-input" placeholder="••••••••" required>
                </div>
                <div class="tb-form-group">
                    <label class="tb-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="tb-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="tb-btn tb-btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
                Register Profile
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--slate-500);">
            Already have an account?
            <a th:href="@{/login}" style="color: var(--primary-600); font-weight: 600; text-decoration: none;">Sign in here</a>
        </div>
    </div>
</div>

</body>
</html>
