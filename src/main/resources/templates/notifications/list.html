<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="tb-container" style="max-width: 820px;">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="tb-page-header">
        <div>
            <h1 class="tb-page-title">Notifications</h1>
            <p class="tb-page-subtitle">Real-time alerts for application status updates, interview schedules, and offers</p>
        </div>
        <form th:action="@{/notifications/read-all}" method="post" th:if="${unreadCount > 0}">
            <button type="submit" class="tb-btn tb-btn-secondary tb-btn-sm">Mark All as Read</button>
        </form>
    </div>

    <div class="tb-card" style="padding: 0;">
        <div th:each="n : ${notifications}"
             style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--slate-100); display: flex; justify-content: space-between; align-items: flex-start;"
             th:styleappend="${!n.read} ? 'background: rgba(99, 102, 241, 0.03);' : ''">
            <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                    <span th:if="${!n.read}" style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary-600); display: inline-block;"></span>
                    <h3 style="font-size: 1rem; font-weight: 700; color: var(--slate-900);" th:text="${n.title}">Notification Title</h3>
                    <span style="font-size: 0.78rem; color: var(--slate-400); margin-left: auto;"
                          th:text="${#temporals.format(n.createdAt, 'MMM dd, HH:mm')}">Time</span>
                </div>
                <p style="color: var(--slate-600); font-size: 0.9rem; line-height: 1.5;" th:text="${n.message}">Message body</p>

                <div th:if="${n.link != null and not #strings.isEmpty(n.link)}" style="margin-top: 0.5rem;">
                    <a th:href="@{${n.link}}" style="color: var(--primary-600); font-size: 0.85rem; font-weight: 600; text-decoration: none;">View details &rarr;</a>
                </div>
            </div>

            <form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post" style="margin-left: 1rem;">
                <button type="submit" class="tb-btn tb-btn-secondary tb-btn-sm" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Mark Read</button>
            </form>
        </div>

        <div th:if="${notifications == null or #lists.isEmpty(notifications.content)}" style="text-align: center; color: var(--slate-400); padding: 3rem;">
            No notifications at this time.
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
