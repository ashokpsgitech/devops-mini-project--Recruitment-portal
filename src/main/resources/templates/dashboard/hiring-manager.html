<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hiring Manager Workspace')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="tb-container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="tb-page-header">
        <div>
            <h1 class="tb-page-title">Hiring Manager Console</h1>
            <p class="tb-page-subtitle">Assigned technical evaluation sessions and candidate feedback</p>
        </div>
    </div>

    <div class="tb-stats-grid">
        <div class="tb-stat-card">
            <span class="tb-stat-label">My Upcoming Interviews</span>
            <span class="tb-stat-value" th:text="${#lists.size(upcomingInterviews)}">0</span>
        </div>
        <div class="tb-stat-card">
            <span class="tb-stat-label">Pending Offers in Org</span>
            <span class="tb-stat-value" style="color: var(--amber-600);" th:text="${pendingOffers}">0</span>
        </div>
    </div>

    <div class="tb-card">
        <div class="tb-card-header">
            <h2 class="tb-card-title">Interviews Awaiting Your Feedback</h2>
        </div>

        <div class="tb-table-wrapper">
            <table class="tb-table">
                <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Role</th>
                    <th>Round</th>
                    <th>Schedule</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="intv : ${upcomingInterviews}">
                    <td style="font-weight: 600;" th:text="${intv.application.applicant != null ? intv.application.applicant.fullName : 'Candidate'}">Candidate</td>
                    <td th:text="${intv.application.job.title}">Role</td>
                    <td><span class="tb-badge tb-badge-interview" th:text="${intv.type}">TECHNICAL</span></td>
                    <td th:text="${#temporals.format(intv.scheduledAt, 'MMM dd, yyyy HH:mm')}">Time</td>
                    <td>
                        <a th:href="@{/interviews/{id}/feedback(id=${intv.id})}" class="tb-btn tb-btn-primary tb-btn-sm">Submit Scorecard</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(upcomingInterviews)}">
                    <td colspan="5" style="text-align: center; color: var(--slate-400); padding: 2rem;">No interviews currently assigned.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
