spring.application.name=recruitment-portal-test

# Isolated In-Memory Database for Unit/Integration Tests
spring.datasource.url=jdbc:h2:mem:recruitment_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Actuator Configuration for Tests
management.endpoints.web.exposure.include=health,info
