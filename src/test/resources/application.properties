spring.application.name=TalentBridge-ATS-test

# ============================================================
# In-memory H2 (PostgreSQL compatibility mode) for isolated tests
# No real database or network needed to run tests
# ============================================================
spring.datasource.url=jdbc:h2:mem:recruitment_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway in tests — Hibernate ddl-auto=create-drop handles schema
spring.flyway.enabled=false

# Disable email in tests
spring.mail.host=localhost
spring.mail.port=1025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info

# Storage — use temp directory in tests
app.storage.local.path=${java.io.tmpdir}/talentbridge-test-resumes
